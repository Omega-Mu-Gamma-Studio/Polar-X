services:
  db:
    image: postgis/postgis:16-3.4
    container_name: polarx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: polarx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - polarx_pgdata:/var/lib/postgresql/data

volumes:
  polarx_pgdata:
